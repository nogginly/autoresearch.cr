dependencies:
  brew:
    - crystal
  custom:
    - make deps
hooks:
  before:
    - mkdir -p bin spec src
actions:
  run:
    command: crystal run
    description: Compile and run the source file
  wipe:
    command: crystal clear_cache
    description: Clear build caches
  lint:
    command: make lint
    description: Run Crystal source linter (ameba)
  spec:
    command: make spec
    description: Run all test specs
  build:
    command: make build
    description: Build the command-line apps into bin/
  test:
    command: make test
    description: Run all tests and linter
